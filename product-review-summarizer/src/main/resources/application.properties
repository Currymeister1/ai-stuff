spring.application.name=product-review-summarizer
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prs}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Existing databases were created before Flyway was wired up. Baseline them at
# V8 so only V9+ is applied; an empty database still runs every migration.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=8

app.vector.dimension=384
app.vector.table=product_reviews_embeddings