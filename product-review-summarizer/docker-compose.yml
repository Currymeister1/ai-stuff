services:
  product_review_summarizer:
    container_name: prs
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DB_URL: ${DB_URL}
        PG_USER: ${PG_USER}
        PG_PASSWORD: ${PG_PASSWORD}
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db_prs:5432/prs
      PG_USER: postgres
      PG_PASSWORD: postgres
    depends_on:
      - db_prs
  db_prs:
    image: pgvector/pgvector:pg16
    container_name: db-prs
    environment:
      POSTGRES_DB: prs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data

volumes:
  pgvector-data:

